name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macOS 15
            runner: macos-15
          - os: macOS 26
            runner: macos-26
          - os: macOS 27
            runner: xcode-27
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select supported Xcode
        run: |
          developer_dir="$(env -u DEVELOPER_DIR bash scripts/xcode-developer-dir.sh)"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
          sw_vers

      - name: Resolve dependencies
        run: make setup

      - name: Run unit tests
        run: make test

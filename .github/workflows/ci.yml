name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve dependencies
        run: make setup DEVELOPER_DIR="$(xcode-select -p)"

      - name: Run unit tests
        run: make test DEVELOPER_DIR="$(xcode-select -p)"

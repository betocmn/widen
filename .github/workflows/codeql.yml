name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "18 2 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: macos-26

    strategy:
      fail-fast: false
      matrix:
        language: [swift]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Build
        run: make build DEVELOPER_DIR="$(xcode-select -p)"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

name: Widen
options:
  bundleIdPrefix: dev.widen
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  postgres-nio:
    url: https://github.com/vapor/postgres-nio.git
    from: 1.33.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:
  WidenKit:
    type: framework
    platform: macOS
    sources: [WidenKit]
    dependencies:
      - package: postgres-nio
        product: PostgresNIO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.widen.WidenKit
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/Frameworks"

  Widen:
    type: application
    platform: macOS
    sources: [Widen]
    dependencies:
      - target: WidenKit
        embed: true
        codeSign: true
    info:
      path: Widen/Info.plist
      properties:
        CFBundleDisplayName: Widen
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Widen — local-only MVP"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.widen.Widen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  WidenTests:
    type: bundle.unit-test
    platform: macOS
    sources: [WidenTests]
    dependencies:
      - target: WidenKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.widen.WidenTests

schemes:
  Widen:
    build:
      targets:
        Widen: all
        WidenTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - WidenTests

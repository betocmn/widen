name: Widen
options:
  bundleIdPrefix: dev.widen
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  postgres-nio:
    url: https://github.com/vapor/postgres-nio.git
    from: 1.33.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.6.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:
  WidenKit:
    type: framework
    platform: macOS
    sources: [WidenKit]
    dependencies:
      - package: postgres-nio
        product: PostgresNIO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.widen.WidenKit
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/Frameworks"

  Widen:
    type: application
    platform: macOS
    sources: [Widen]
    dependencies:
      - target: WidenKit
        embed: true
        codeSign: true
      - package: Sparkle
    info:
      path: Widen/Info.plist
      properties:
        CFBundleDisplayName: Widen
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Widen — local-only MVP"
        NSLocalNetworkUsageDescription: "Widen connects to PostgreSQL databases you configure on your local network."
        # Sparkle auto-update. The feed and the zipped builds are hosted as
        # static files next to the marketing site (see docs/update-server-plan.md).
        SUFeedURL: "https://widen.dev/appcast.xml"
        # Add SUPublicEDKey here only after generating the real Sparkle EdDSA
        # key pair. Do not ship a placeholder key: Sparkle treats invalid keys
        # as a fatal updater configuration error at launch.
        # Auto-check for updates on by default (opt-out in Settings ▸ General).
        # Setting this explicitly also suppresses Sparkle's first-run prompt.
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.widen.Widen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        # Private Cloud Compute needs the Apple-managed entitlement in
        # Widen/Widen.entitlements, which cannot ship on an ad-hoc signed
        # build (macOS kills the app at launch). Once Apple grants access
        # (https://developer.apple.com/private-cloud-compute/) and a real
        # signing identity exists, add here:
        #   CODE_SIGN_ENTITLEMENTS: Widen/Widen.entitlements
        #   CODE_SIGN_STYLE: Automatic
        #   DEVELOPMENT_TEAM: <team id>
        # and build with Xcode 27+ so the PCC code path is compiled in.

  WidenTests:
    type: bundle.unit-test
    platform: macOS
    sources: [WidenTests]
    dependencies:
      - target: WidenKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.widen.WidenTests

schemes:
  Widen:
    build:
      targets:
        Widen: all
        WidenTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - WidenTests
